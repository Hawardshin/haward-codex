<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artifact Title</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #1f2328;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        line-height: 1.6;
      }

      section {
        border: 1px solid #d8dee4;
        background: #ffffff;
        border-radius: 8px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Artifact Title</h1>
        <p>Short description of the artifact.</p>
      </header>
      <section>
        <h2>Content</h2>
        <p>Replace this template with the artifact content.</p>
      </section>
    </main>
  </body>
</html>
