[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.1.0"
description = "Python-first personal agent-building platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-platform = "agent_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
