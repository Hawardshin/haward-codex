<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Operations Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f8fb;
        color: #1f2937;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        margin-bottom: 26px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #526173;
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        border: 1px solid #d8dee8;
        border-radius: 8px;
        background: #ffffff;
        padding: 18px;
        min-height: 150px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      a {
        color: #1f6feb;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      ul {
        margin: 10px 0 0;
        padding-left: 18px;
        color: #526173;
        line-height: 1.7;
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Codex Operations Dashboard</h1>
        <p>작업 시작점, 프롬프트 라우터, 워크플로, 저장소 맵으로 빠르게 이동하기 위한 운영 대시보드다.</p>
      </header>

      <section class="grid">
        <article class="card">
          <h2>Start</h2>
          <ul>
            <li><a href="../index.md">Operations Index</a></li>
            <li><a href="../workflows/00-start-here.md">Start Here Workflow</a></li>
            <li><a href="../prompts/00-router.md">Prompt Router</a></li>
          </ul>
        </article>
        <article class="card">
          <h2>Maps</h2>
          <ul>
            <li><a href="../maps/repository-map.md">Repository Map</a></li>
            <li><a href="../maps/prompt-map.md">Prompt Map</a></li>
          </ul>
        </article>
        <article class="card">
          <h2>Platform</h2>
          <ul>
            <li><a href="../../agent-platform/README.md">Agent Platform</a></li>
            <li><a href="../../_docs/persistent-instructions.md">Persistent Instructions</a></li>
            <li><a href="../../_history/README.md">Work History</a></li>
          </ul>
        </article>
      </section>
    </main>
  </body>
</html>
